name: Compiler et tester OpenWeb

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: rustup update stable
      - run: rustup default stable
      - run: npm ci
      - run: npx --no install-electron
      - run: npm run build
      - run: npm test
      - name: Test de navigation sur serveur local
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npm run test:desktop -- --disable-gpu
      - run: npm run package
      - name: Créer une archive qui conserve les permissions
        shell: bash
        run: tar -czf openweb-${{ runner.os }}-${{ runner.arch }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: OpenWeb-${{ runner.os }}-${{ runner.arch }}
          path: openweb-${{ runner.os }}-${{ runner.arch }}.tar.gz
          if-no-files-found: error
