[package]
name = "openweb-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
getrandom = "0.4"
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }

[build-dependencies]
napi-build = "2"
